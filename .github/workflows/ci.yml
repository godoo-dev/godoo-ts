name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualify19:
        description: Qualify Odoo19 only after18 on this same candidate
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_candidate:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_DIR: ${{ github.workspace }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      matrix:
        node: ["22.18.0", "24.22.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only the release guard reads origin/main; checks need just HEAD.
          fetch-depth: ${{ inputs.release_candidate == true && '0' || '1' }}
      - uses: pnpm/action-setup@71c92474e7e4f5bca283fb17ef80fba9cdb2b4b1 # v6.0.2
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: inputs.release_candidate == true
        # Check main here because the candidate is packed later in this job.
        env:
          CANDIDATE_DIR: ""
        run: node scripts/release-guard.mjs
      - run: pnpm check
      # The Node 24 leg packs and installs the candidate from the build `pnpm check` tested.
      - if: matrix.node == '24.22.1'
        run: node scripts/candidate.mjs pack "$CANDIDATE_DIR"
      - if: matrix.node == '24.22.1'
        run: pnpm check:package
      - if: matrix.node == '24.22.1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ts-candidate-${{ github.sha }}
          path: ${{ env.CANDIDATE_DIR }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      # odoo18/odoo19 source suites reuse the Node 24 build instead of building again.
      - if: matrix.node == '24.22.1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ts-dist-${{ github.sha }}
          path: packages/*/dist
          if-no-files-found: error
          overwrite: true
          retention-days: 14
  odoo18:
    needs: offline
    runs-on: ubuntu-latest
    env:
      CANDIDATE_DIR: ${{ github.workspace }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@71c92474e7e4f5bca283fb17ef80fba9cdb2b4b1 # v6.0.2
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Source suites import built workspace packages. These are not promotion artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ts-dist-${{ github.sha }}
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ts-candidate-${{ github.sha }}
          path: ${{ env.CANDIDATE_DIR }}
      - run: pnpm check:odoo18
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ts-qualified-${{ github.sha }}
          path: ${{ env.CANDIDATE_DIR }}
          if-no-files-found: error
          retention-days: 14
  required:
    name: required
    if: ${{ always() }}
    needs: [offline, odoo18, odoo19]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Require every mandatory result
        env:
          RESULTS: ${{ toJSON(needs) }}
          QUALIFY19: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify19 == true }}
        run: node scripts/required.mjs
  odoo19:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify19 == true
    needs: [offline, odoo18]
    runs-on: ubuntu-latest
    env:
      CANDIDATE_DIR: ${{ github.workspace }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@71c92474e7e4f5bca283fb17ef80fba9cdb2b4b1 # v6.0.2
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ts-dist-${{ github.sha }}
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ts-qualified-${{ github.sha }}
          path: ${{ env.CANDIDATE_DIR }}
      - run: pnpm check:odoo19
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ts-odoo19-${{ github.sha }}
          path: ${{ env.CANDIDATE_DIR }}
          if-no-files-found: error
