# Validation-only driver: no tags, pushes, releases, publication or deployments.
name: Nonpublishing version rehearsal
on:
  pull_request:
    branches: ['validate/hosted-cicd-20261024']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f68f5791346aaeb8b9d7ea636c1bcf61c15511ed
        with:
          version: 11.1.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm this PR cannot enter release promotion
        run: |
          if node scripts/release-guard.mjs > "$RUNNER_TEMP/guard.log" 2>&1; then exit 1; fi
          grep -F 'Promotion requires workflow dispatch on reviewed main' "$RUNNER_TEMP/guard.log"
      - name: Exercise the native nonpublishing preparation command
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/head-before"
          git show-ref --tags > "$RUNNER_TEMP/tags-before" || true
          pnpm version-packages
      - name: Retain reviewable patch and prove no commits or tags were created
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/head-after"
          git show-ref --tags > "$RUNNER_TEMP/tags-after" || true
          diff "$RUNNER_TEMP/head-before" "$RUNNER_TEMP/head-after"
          diff "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after"
          git diff HEAD --binary > "$RUNNER_TEMP/version-preparation.patch"
          test -s "$RUNNER_TEMP/version-preparation.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nonpublishing-preparation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/version-preparation.patch
            ${{ runner.temp }}/guard.log
          if-no-files-found: error
