name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated immutable main candidate (protected environment required)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ts-release
  cancel-in-progress: false
jobs:
  eligible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - run: node scripts/release-guard.mjs
  validate:
    needs: eligible
    uses: ./.github/workflows/ci.yml
    with:
      release_candidate: true
  publish:
    if: inputs.publish == true
    needs: [eligible, validate]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      CANDIDATE_DIR: ${{ github.workspace }}/../ts-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@f68f5791346aaeb8b9d7ea636c1bcf61c15511ed # v6.0.2
        with:
          version: 11.1.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts-qualified-${{ github.sha }}
          path: ${{ env.CANDIDATE_DIR }}
      - name: Verify candidate, hashes and same-run18 proof before promotion
        run: node scripts/release-guard.mjs
      - name: Publish only tested tarball bytes (no build or version operation)
        run: node scripts/publish-candidate.mjs
        env:
          GODOO_PUBLISH: ${{ inputs.publish }}
