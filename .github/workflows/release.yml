name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated immutable main candidate (protected environment required)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ts-release
  cancel-in-progress: false
jobs:
  eligible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - run: node scripts/release-guard.mjs
  validate:
    needs: eligible
    uses: ./.github/workflows/ci.yml
    with:
      release_candidate: true
  promotion-check:
    needs: [eligible, validate]
    runs-on: ubuntu-latest
    env:
      CANDIDATE_DIR: ${{ github.workspace }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@71c92474e7e4f5bca283fb17ef80fba9cdb2b4b1 # v6.0.2
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ts-qualified-${{ github.sha }}
          path: ${{ env.CANDIDATE_DIR }}
      - name: Verify exact qualified artifacts and promotion proof without publishing
        run: node scripts/release-guard.mjs
  publish:
    if: inputs.publish == true
    needs: [eligible, validate, promotion-check]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      CANDIDATE_DIR: ${{ github.workspace }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@71c92474e7e4f5bca283fb17ef80fba9cdb2b4b1 # v6.0.2
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ts-qualified-${{ github.sha }}
          path: ${{ env.CANDIDATE_DIR }}
      - name: Verify candidate, hashes and same-run18 proof before promotion
        run: node scripts/release-guard.mjs
      - name: Publish only tested tarball bytes (no build or version operation)
        run: node scripts/publish-candidate.mjs
        env:
          GODOO_PUBLISH: ${{ inputs.publish }}
