name: Prepare versions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changesets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@f68f5791346aaeb8b9d7ea636c1bcf61c15511ed # v6.0.2
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - run: node scripts/release-guard.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain reviewable version preparation; no push or publication
        run: |
          # Changesets creates untracked changelogs; include their bytes in the patch.
          git add --intent-to-add -- packages/*/CHANGELOG.md
          git diff HEAD --binary > "${{ runner.temp }}/version-preparation.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/version-preparation.patch
          if-no-files-found: error
