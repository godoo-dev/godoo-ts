name: Prepare versions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changesets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@f68f5791346aaeb8b9d7ea636c1bcf61c15511ed # v6.0.2
        with:
          version: 11.1.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: node scripts/release-guard.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain reviewable version preparation; no push or publication
        run: |
          # Changesets creates untracked changelogs; include their bytes in the patch.
          git add --intent-to-add -- packages/*/CHANGELOG.md
          git diff HEAD --binary > "${{ runner.temp }}/version-preparation.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: version-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/version-preparation.patch
          if-no-files-found: error
